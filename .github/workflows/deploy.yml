# Publica La Doxa en GitHub Pages.
#
# MANUAL a propósito (`workflow_dispatch`): el sitio se hornea con los datos
# que sirve el backend del portátil por un túnel de Cloudflare, así que antes
# de lanzarlo hay que tener, EN ESTE ORDEN:
#
#   1. El portátil encendido y `docker compose up -d`.
#   2. El pipeline del día ya ejecutado (si no, se publica el digest de ayer).
#   3. El túnel arriba (`cloudflared tunnel run el-contraste`).
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   API_BASE_URL              https://api.tu-dominio.tld   ← también es secreto:
#                             este workflow es público y el hostname del túnel
#                             no tiene por qué estarlo.
#   CF_ACCESS_CLIENT_ID       service token de Cloudflare Access
#   CF_ACCESS_CLIENT_SECRET   idem
#
# Variables (no secretas):
#   SITE_URL    https://usuario.github.io  o  https://tu-dominio.tld
#   BASE_PATH   /el-contraste-web/         o  /

name: Publicar el sitio

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: >-
          URL pública de la API. La rellena sola la llamada desde el backend;
          si lanzas el workflow a mano desde la web de GitHub, pégala aquí
          (con un quick tunnel cambia en cada arranque).
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca dos despliegues a la vez, y sin cancelar el que ya va por la mitad:
# cancelar a mitad de un deploy deja Pages en un estado raro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # La locución del día, que no viaja en el repo: la genera
      # `pipeline/locucion.py` en el portátil y pesa ~800 KB diarios, así que
      # commitearla engordaría el historial del espejo sin ningún motivo.
      #
      # ⚠️ Este paso NO puede tumbar el despliegue. Si no hay locución —la etapa
      # se cayó, falta la clave de Azure, el guion no se pudo escribir— el sitio
      # se publica igual y la página cae al botón de la voz del navegador. Un
      # sitio sin audio es mucho mejor que un sitio sin publicar.
      - name: Traer la locución del día
        continue-on-error: true
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          mkdir -p public/audio
          codigo=$(curl -sS -o public/audio/resumen.mp3 -w '%{http_code}' \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID:-}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET:-}" \
            "${API_BASE_URL}/api/briefing/latest/audio.mp3" || echo 000)

          # Un 404 es normal y esperado: significa «hoy no hay locución».
          # Y hay que BORRAR el fichero, porque curl deja escrito el cuerpo del
          # error y un MP3 con un JSON dentro rompe el reproductor en vez de
          # caer al respaldo.
          if [ "$codigo" != "200" ]; then
            echo "Sin locución (HTTP $codigo): el sitio saldrá con la voz del navegador."
            rm -f public/audio/resumen.mp3
            exit 0
          fi

          # Access devuelve su pantalla de login con un 200, la misma trampa que
          # ya cubre src/lib/api.ts. Un MP3 empieza por ID3 o por 0xFF; si esto
          # es HTML, no es audio.
          if ! file public/audio/resumen.mp3 | grep -qi 'audio\|mpeg\|MPEG'; then
            echo "::warning::Lo descargado no es audio. Se descarta."
            rm -f public/audio/resumen.mp3
            exit 0
          fi
          echo "Locución: $(du -h public/audio/resumen.mp3 | cut -f1)"

      - name: Hornear el sitio
        env:
          # El input manda: con un quick tunnel la URL es distinta cada vez y
          # la manda el backend al disparar. El secret es el respaldo, para
          # cuando algún día haya un túnel con nombre y hostname fijo.
          API_BASE_URL: ${{ inputs.api_base_url || secrets.API_BASE_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          # Se deducen del propio repo: con el dominio por defecto de Pages el
          # sitio cuelga de /<repo>/, y si BASE_PATH no coincide EXACTAMENTE
          # con el nombre del repo, el sitio sale sin CSS y con los enlaces
          # rotos. Deducirlo evita ese fallo por completo.
          # Las variables solo hacen falta el día que haya dominio propio.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build
        # src/lib/api.ts ya se cae solo si la API no responde, si devuelve el
        # HTML de login de Access en vez de JSON, o si el digest viene sin un
        # solo clúster. Este paso hereda esos fallos.

      - name: Guardarraíl · el sitio no puede salir vacío
        run: |
          set -euo pipefail
          paginas=$(find dist -name '*.html' | wc -l | tr -d ' ')
          echo "Páginas generadas: $paginas"

          # Un digest real trae decenas de historias; por debajo de esto algo
          # ha ido mal aunque el build haya terminado en verde.
          if [ "$paginas" -lt 20 ]; then
            echo "::error::Solo $paginas páginas. Se aborta antes de publicar" \
                 "un sitio pelado encima de uno bueno."
            exit 1
          fi

          # Si esto aparece, el HTML se quedó con el esqueleto de las islas
          # viejas y los datos no se hornearon.
          if grep -rq "Componiendo la portada" dist/index.html; then
            echo "::error::La portada salió sin datos horneados."
            exit 1
          fi

          # Pages sirve `dist` tal cual desde Actions (no pasa por Jekyll),
          # pero el fichero es gratis y protege si algún día se vuelve al
          # despliegue por rama, donde Jekyll SÍ se comería `_astro/`.
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
